<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #FFF4C2;
            color: #222;
        }

        .header {
            background: #F5C400;
            color: #000;
            padding: 18px;
            text-align: center;
            border-radius: 10px;
            margin: 0 auto 25px;
            max-width: 900px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .header h2 {
            margin: 0;
            font-size: 23px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        h1, h2 {
            color: #222;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #555;
        }

        input, button {
            padding: 11px;
            margin: 6px 4px 6px 0;
            border-radius: 5px;
            font-size: 14px;
        }

        input {
            border: 1px solid #ccc;
            color: #222;
        }

        input:focus {
            outline: none;
            border-color: #D6AA00;
            box-shadow: 0 0 4px rgba(245,196,0,0.4);
        }

        button {
            border: none;
            background: #F5C400;
            color: #000;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #DDB000;
        }

        .delete {
            background: #d93025;
            color: white;
        }

        .delete:hover {
            background: #b71c1c;
        }

        .table-container {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            min-width: 500px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #F5C400;
            color: #000;
        }

        tbody tr:hover {
            background: #FFF9E6;
        }

        .back-btn {
            margin-top: 25px;
        }

        footer {
            text-align: center;
            padding: 20px 10px;
            color: #444;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 15px;
                overflow: hidden;
            }

            input {
                width: 100%;
                margin: 6px 0;
            }

            #userForm button {
                width: 100%;
                margin: 8px 0;
            }

            .header h2 {
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

<div class="header">
    <h2>ONLINE EXAMINATION PORTAL</h2>
</div>

<div class="container">

    <h1 id="pageTitle">Manage Users</h1>

    <p>Add, view and delete user records.</p>

    <h2>Add User</h2>

    <form id="userForm">
        <input type="text" id="userName"
            placeholder="Enter full name" required>

        <input type="email" id="userEmail"
            placeholder="Enter email address" required>

        <button type="submit">Add User</button>
    </form>

    <h2>User List</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="userList"></tbody>
        </table>
    </div>

    <button class="back-btn"
        onclick="window.location.href='admin.html'">
        Back to Admin Dashboard
    </button>

</div>

<footer>
    Exam Guard © 2026
</footer>

<script>
    const params = new URLSearchParams(window.location.search);
    const role = params.get("role") === "examiner"
        ? "examiner"
        : "student";

    const storageKey = role + "Users";

    document.getElementById("pageTitle").innerText =
        role === "student" ? "Manage Students" : "Manage Examiners";

    let users = JSON.parse(
        localStorage.getItem(storageKey) || "[]"
    );

    function displayUsers() {
        const userList = document.getElementById("userList");

        userList.innerHTML = "";

        users.forEach((user, index) => {
            const row = document.createElement("tr");

            const nameCell = document.createElement("td");
            nameCell.textContent = user.name;

            const emailCell = document.createElement("td");
            emailCell.textContent = user.email;

            const actionCell = document.createElement("td");
            const deleteButton = document.createElement("button");

            deleteButton.textContent = "Delete";
            deleteButton.className = "delete";

            deleteButton.onclick = function () {
                if (confirm("Delete this user record?")) {
                    users.splice(index, 1);

                    localStorage.setItem(
                        storageKey,
                        JSON.stringify(users)
                    );

                    displayUsers();
                }
            };

            actionCell.appendChild(deleteButton);

            row.appendChild(nameCell);
            row.appendChild(emailCell);
            row.appendChild(actionCell);

            userList.appendChild(row);
        });

        if (users.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 3;
            cell.textContent = "No users added yet.";

            row.appendChild(cell);
            userList.appendChild(row);
        }
    }

    document.getElementById("userForm").addEventListener(
        "submit",
        function(event) {
            event.preventDefault();

            const name = document.getElementById("userName").value.trim();
            const email = document.getElementById("userEmail").value.trim();

            users.push({ name: name, email: email });

            localStorage.setItem(
                storageKey,
                JSON.stringify(users)
            );

            this.reset();
            displayUsers();

            alert("User added successfully!");
        }
    );

    displayUsers();
</script>

</body>
</html>
