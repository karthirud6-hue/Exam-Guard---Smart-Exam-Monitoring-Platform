<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Examinations</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #333;
        }

        header {
            background: #1746a2;
            color: white;
            padding: 20px 5%;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        h2 {
            color: #1746a2;
        }

        .exam-card {
            background: white;
            padding: 20px;
            margin: 18px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .exam-card p {
            line-height: 1.7;
        }

        button {
            background: #1746a2;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .delete-btn {
            background: #d93025;
        }

        .back-btn {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h2 style="color:white;">Smart Exam Monitoring System</h2>
</header>

<main>
    <h2>Manage Examinations</h2>
    <p>View and manage examinations created by the examiner.</p>

    <div id="examList"></div>

    <button class="back-btn" onclick="goBack()">
        Back to Dashboard
    </button>
</main>

<script>
    const API_URL = "http://127.0.0.1:8000";

    // Check login and role
    async function verifyAccess() {
        const token = sessionStorage.getItem("access_token");
        const role = sessionStorage.getItem("user_role");

        if (!token || !["admin", "examiner"].includes(role)) {
            window.location.replace("index.html");
            return false;
        }

        try {
            const response = await fetch(
                `${API_URL}/${role}/dashboard`,
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            if (!response.ok) {
                sessionStorage.clear();
                window.location.replace("index.html");
                return false;
            }

            return true;

        } catch (error) {
            alert("Cannot connect to backend.");
            return false;
        }
    }

    // Display examinations from SQLite
    async function displayExams() {
        const token = sessionStorage.getItem("access_token");
        const examList = document.getElementById("examList");

        examList.textContent = "Loading examinations...";

        try {
            const response = await fetch(`${API_URL}/exams`, {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok) {
                throw new Error("Unable to retrieve examinations.");
            }

            const exams = await response.json();
            examList.innerHTML = "";

            if (exams.length === 0) {
                examList.textContent = "No examinations created yet.";
                return;
            }

            exams.forEach(exam => {
                const card = document.createElement("div");
                card.className = "exam-card";

                const title = document.createElement("h3");
                title.textContent = exam.exam_name;

                const details = document.createElement("p");
                details.innerHTML = `
                    <strong>Subject:</strong> ${escapeHTML(exam.subject)}<br>
                    <strong>Date:</strong> ${escapeHTML(exam.exam_date)}<br>
                    <strong>Start Time:</strong> ${escapeHTML(exam.start_time)}<br>
                    <strong>Duration:</strong> ${escapeHTML(exam.duration)} minutes<br>
                    <strong>Total Marks:</strong> ${escapeHTML(exam.total_marks)}<br>
                    <strong>Questions:</strong> ${escapeHTML(exam.total_questions)}<br>
                    <strong>Created By:</strong> ${escapeHTML(exam.created_by)}
                `;

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "Delete Examination";

                deleteButton.addEventListener("click", () => {
                    deleteExam(exam.id);
                });

                card.appendChild(title);
                card.appendChild(details);
                card.appendChild(deleteButton);

                examList.appendChild(card);
            });

        } catch (error) {
            examList.textContent = error.message;
        }
    }

    // Escape text before displaying it
    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    // Delete examination from SQLite
    async function deleteExam(examId) {
        if (!confirm("Are you sure you want to delete this examination?")) {
            return;
        }

        const token = sessionStorage.getItem("access_token");

        try {
            const response = await fetch(
                `${API_URL}/exams/${examId}`,
                {
                    method: "DELETE",
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Could not delete examination.");
            }

            alert(data.message);
            displayExams();

        } catch (error) {
            alert(error.message);
        }
    }

    // Back to appropriate dashboard
    function goBack() {
        const role = sessionStorage.getItem("user_role");

        if (role === "admin") {
            window.location.href = "Admin.html";
        } else {
            window.location.href = "Examiner.html";
        }
    }

    // Check access before loading examinations
    async function initializePage() {
        const allowed = await verifyAccess();

        if (allowed) {
            displayExams();
        }
    }

    initializePage();
</script>
</body>
</html>
