<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Examinations</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #333;
        }

        header {
            background: #1746a2;
            color: white;
            padding: 20px 5%;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        h2 {
            color: #1746a2;
        }

        .exam-card {
            background: white;
            padding: 20px;
            margin: 18px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .exam-card p {
            line-height: 1.7;
        }

        button {
            background: #1746a2;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        .delete-btn {
            background: #d93025;
        }

        .back-btn {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h2 style="color:white;">Smart Exam Monitoring System</h2>
</header>

<main>
    <h2>Manage Examinations</h2>
    <p>View and manage examinations created by the examiner.</p>

    <div id="examList"></div>

    <button class="back-btn"
        onclick="window.location.href='examiner.html'">
        Back to Dashboard
    </button>
</main>

<script>
    function displayExams() {
        const exams = JSON.parse(
            localStorage.getItem("examinations") || "[]"
        );

        const examList = document.getElementById("examList");

        examList.innerHTML = "";

        if (exams.length === 0) {
            examList.innerHTML = "<p>No examinations created yet.</p>";
            return;
        }

        exams.forEach((exam, index) => {
            const card = document.createElement("div");
            card.className = "exam-card";

            card.innerHTML = `
                <h3>${escapeHTML(exam.examName)}</h3>
                <p>
                    <strong>Subject:</strong> ${escapeHTML(exam.subject)}<br>
                    <strong>Date:</strong> ${escapeHTML(exam.examDate)}<br>
                    <strong>Start Time:</strong> ${escapeHTML(exam.startTime)}<br>
                    <strong>Duration:</strong> ${escapeHTML(exam.duration)} minutes<br>
                    <strong>Total Marks:</strong> ${escapeHTML(exam.totalMarks)}<br>
                    <strong>Questions:</strong> ${escapeHTML(exam.totalQuestions)}
                </p>
                <button class="delete-btn"
                    onclick="deleteExam(${index})">
                    Delete Examination
                </button>
            `;

            examList.appendChild(card);
        });
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, function(character) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[character];
        });
    }

    function deleteExam(index) {
        if (!confirm("Are you sure you want to delete this examination?")) {
            return;
        }

        const exams = JSON.parse(
            localStorage.getItem("examinations") || "[]"
        );

        exams.splice(index, 1);

        localStorage.setItem(
            "examinations",
            JSON.stringify(exams)
        );

        displayExams();
    }

    displayExams();
</script>

</body>
</html>
