<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Examinations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #FFF4C2;
            color: #222;
        }

        header {
            background: #F5C400;
            color: #000;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        header h2 {
            margin: 0;
            color: #000;
            font-size: 23px;
        }

        main {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        main h2 {
            color: #000;
            margin-bottom: 10px;
        }

        main > p {
            color: #555;
            margin-bottom: 25px;
        }

        .exam-card {
            background: white;
            padding: 25px;
            margin: 18px 0;
            border-radius: 12px;
            border: 1px solid #f0e5b5;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .exam-card h3 {
            color: #000;
            margin-bottom: 15px;
        }

        .exam-card p {
            line-height: 1.9;
            color: #444;
        }

        button {
            background: #F5C400;
            color: #000;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
            margin: 5px;
            font-weight: bold;
            font-size: 14px;
            transition: 0.2s;
        }

        button:hover {
            background: #dfb200;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background: #b52a36;
        }

        .back-btn {
            margin-top: 20px;
        }

        .empty-message {
            background: white;
            padding: 22px;
            border-radius: 10px;
            color: #555;
            text-align: center;
            border: 1px solid #f0e5b5;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            main {
                padding: 15px;
            }

            .exam-card {
                padding: 18px;
            }

            header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>ONLINE EXAMINATION PORTAL</h2>
</header>

<main>

    <h2>Manage Examinations</h2>

    <p>View and manage examinations created by the examiner.</p>

    <div id="examList"></div>

    <button class="back-btn"
        onclick="window.location.href='examiner.html'">
        ← Back to Dashboard
    </button>

</main>

<footer>
    Exam Guard © 2026
</footer>

<script>

    function displayExams() {

        const exams = JSON.parse(
            localStorage.getItem("examinations") || "[]"
        );

        const examList = document.getElementById("examList");

        examList.innerHTML = "";

        if (exams.length === 0) {

            examList.innerHTML =
                '<p class="empty-message">No examinations created yet.</p>';

            return;

        }

        exams.forEach((exam, index) => {

            const card = document.createElement("div");

            card.className = "exam-card";

            card.innerHTML = `
                <h3>${escapeHTML(exam.examName || exam.name || "")}</h3>

                <p>
                    <strong>Subject:</strong> ${escapeHTML(exam.subject || "")}<br>
                    <strong>Date:</strong> ${escapeHTML(exam.examDate || "")}<br>
                    <strong>Start Time:</strong> ${escapeHTML(exam.startTime || "")}<br>
                    <strong>Duration:</strong> ${escapeHTML(exam.duration || "")} minutes<br>
                    <strong>Total Marks:</strong> ${escapeHTML(exam.totalMarks || "")}<br>
                    <strong>Questions:</strong> ${escapeHTML(exam.totalQuestions || "")}
                </p>

                <button class="delete-btn"
                    onclick="deleteExam(${index})">
                    Delete Examination
                </button>
            `;

            examList.appendChild(card);

        });

    }

    function escapeHTML(value) {

        return String(value).replace(/[&<>"']/g, function(character) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[character];

        });

    }

    function deleteExam(index) {

        if (!confirm("Are you sure you want to delete this examination?")) {
            return;
        }

        const exams = JSON.parse(
            localStorage.getItem("examinations") || "[]"
        );

        exams.splice(index, 1);

        localStorage.setItem(
            "examinations",
            JSON.stringify(exams)
        );

        displayExams();

    }

    displayExams();

</script>

</body>
</html>
