<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification | Smart Exam Platform</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;
            background: #FFF4C2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            color: #222222;
        }

        /* BRAND HEADER */

        .top-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: #F5C400;
            color: #222222;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        .top-brand h2 {
            font-size: 19px;
            letter-spacing: 1.5px;
            color: #222222;
        }

        .top-brand small {
            display: block;
            font-size: 9px;
            letter-spacing: 2px;
            color: #665A30;
            margin-top: 4px;
        }

        /* VERIFICATION CARD */

        .verification-box {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0,0,0,0.12);
            text-align: center;
        }

        /* CARD HEADER */

        .verification-header {
            background: #F5C400;
            padding: 30px 20px;
        }

        .verification-icon {
            width: 60px;
            height: 60px;
            margin: 0 auto 14px;
            background: rgba(255,255,255,0.45);
            border-radius: 15px;
            display: grid;
            place-items: center;
            font-size: 28px;
        }

        .verification-header h1 {
            font-size: 24px;
            color: #222222;
        }

        .verification-header p {
            color: #403500;
            font-size: 13px;
            margin-top: 7px;
        }

        /* CARD CONTENT */

        .verification-content {
            padding: 30px;
        }

        .verification-content h2 {
            color: #222222;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .verification-content > p {
            color: #555555;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        /* OTP INPUT */

        input {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            box-sizing: border-box;
            border: 1px solid #D8D8D8;
            border-radius: 8px;
            background: #FFFEF9;
            color: #222222;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
        }

        input:focus {
            border-color: #D4A900;
            box-shadow: 0 0 0 3px rgba(245,196,0,0.18);
        }

        input::placeholder {
            color: #999999;
            font-size: 14px;
            letter-spacing: 1px;
        }

        /* BUTTONS */

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: #F5C400;
            color: #222222;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.25s;
        }

        button:hover {
            background: #E4B600;
            transform: translateY(-2px);
        }

        .resend {
            background: #FFF4C2;
            color: #222222;
            border: 1px solid #F1DF9B;
            margin-top: 12px;
        }

        .resend:hover {
            background: #FFEBA0;
        }

        /* FOOTER */

        .verification-footer {
            border-top: 1px solid #EEEEEE;
            margin-top: 22px;
            padding-top: 17px;
            color: #777777;
            font-size: 11px;
            line-height: 1.8;
        }

        .page-footer {
            margin-top: 22px;
            text-align: center;
            color: #665A30;
            font-size: 11px;
            line-height: 1.8;
        }

        /* MOBILE RESPONSIVENESS */

        @media (max-width: 500px) {
            .verification-content {
                padding: 25px 20px;
            }

            .verification-header h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <!-- BRAND HEADER -->

    <div class="top-brand">

        <div class="brand-icon">SE</div>

        <div>
            <h2>SMART EXAM</h2>
            <small>EXAMINATION PLATFORM</small>
        </div>

    </div>


    <!-- VERIFICATION CARD -->

    <main class="verification-box">

        <section class="verification-header">

            <div class="verification-icon">✉</div>

            <h1>Email Verification</h1>

            <p>Verify your email to continue</p>

        </section>


        <section class="verification-content">

            <h2>Enter Your OTP</h2>

            <p>
                We have sent a verification code to your email address.
                Please enter the OTP below.
            </p>


            <!-- OTP FORM -->

            <form action="index.html" method="get">

                <input
                    type="text"
                    name="otp"
                    placeholder="Enter OTP"
                    maxlength="6"
                    pattern="[0-9]{6}"
                    inputmode="numeric"
                    required
                >

                <button type="submit">
                    Verify Email →
                </button>

            </form>


            <!-- RESEND OTP -->

            <button class="resend" type="button"
                onclick="alert('OTP sending will be connected with the backend later.')">
                Resend OTP
            </button>


            <div class="verification-footer">
                🔒 Secure email verification
            </div>

        </section>

    </main>


    <!-- PAGE FOOTER -->

    <footer class="page-footer">
        <p>© 2026 Smart Exam Platform</p>
        <p>Secure • Intelligent • Transparent</p>
    </footer>

</body>
</html>
