<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Examination</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
        }

        header {
            background: #1746a2;
            color: white;
            padding: 20px 40px;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1746a2;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1746a2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #10357d;
        }
    </style>
</head>

<body>

    <header>
        <h2 style="color:white; text-align:left; margin:0;">
            Smart Exam Monitoring System
        </h2>
    </header>

    <div class="container">

        <h2>Create New Examination</h2>

        <form id="examForm">

            <label>Examination Name</label>
            <input type="text" id="examName" required>

            <label>Subject</label>
            <input type="text" id="subject" required>

            <label>Examination Date</label>
            <input type="date" id="examDate" required>

            <label>Start Time</label>
            <input type="time" id="startTime" required>

            <label>Duration (Minutes)</label>
            <input type="number" id="duration" min="1" required>

            <label>Total Marks</label>
            <input type="number" id="totalMarks" min="1" required>

            <label>Number of Questions</label>
            <input type="number" id="totalQuestions" min="1" required>

            <button type="submit">Create Examination</button>

        </form>

    </div>
    
<script>
    // Allow only Admin and Examiner accounts
    async function verifyAccess() {

        const token = sessionStorage.getItem("access_token");
        const role = sessionStorage.getItem("user_role");

        if (!token || !["admin", "examiner"].includes(role)) {
            window.location.replace("index.html");
            return false;
        }

        try {
            const response = await fetch(
                "http://127.0.0.1:8000/" + role + "/dashboard",
                {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                }
            );

            if (!response.ok) {
                sessionStorage.clear();
                window.location.replace("index.html");
                return false;
            }

            return true;

        } catch (error) {
            alert("Cannot connect to the backend. Please check whether the server is running.");
            return false;
        }
    }

    // Submit examination details to backend
    document.getElementById("examForm").addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const token = sessionStorage.getItem("access_token");

            const exam = {
                examName: document.getElementById("examName").value.trim(),
                subject: document.getElementById("subject").value.trim(),
                examDate: document.getElementById("examDate").value,
                startTime: document.getElementById("startTime").value,
                duration: Number(document.getElementById("duration").value),
                totalMarks: Number(document.getElementById("totalMarks").value),
                totalQuestions: Number(document.getElementById("totalQuestions").value)
            };

            const submitButton = document.querySelector(
                "#examForm button[type='submit']"
            );

            submitButton.disabled = true;
            submitButton.textContent = "Creating...";

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/exams",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Authorization": "Bearer " + token
                        },
                        body: JSON.stringify(exam)
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Could not create examination.");
                }

                alert(data.message);

                window.location.href = "Examiner.html";

            } catch (error) {

                alert(error.message);

            } finally {

                submitButton.disabled = false;
                submitButton.textContent = "Create Examination";

            }
        }
    );

    // Check access when the page opens
    verifyAccess();
</script>
</body>
</html>
