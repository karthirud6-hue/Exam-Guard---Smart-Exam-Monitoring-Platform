<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Examination</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #FFF4C2;
            color: #222;
        }

        header {
            background: #F5C400;
            color: #000;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        header h2 {
            margin: 0;
            color: #000;
            font-size: 23px;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            border: 1px solid #f0e5b5;
        }

        .container h2 {
            color: #000;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 17px;
            font-weight: bold;
            color: #222;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #d6d0b8;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d5aa00;
            box-shadow: 0 0 4px rgba(245,196,0,0.35);
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 28px;
            background: #F5C400;
            color: #000;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #dfb200;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 12px;
                padding: 22px;
            }

            header h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>ONLINE EXAMINATION PORTAL</h2>
    </header>

    <div class="container">

        <h2>Create New Examination</h2>

        <form id="examForm">

            <label>Examination Name</label>
            <input type="text" id="examName" required>

            <label>Subject</label>
            <input type="text" id="subject" required>

            <label>Examination Date</label>
            <input type="date" id="examDate" required>

            <label>Start Time</label>
            <input type="time" id="startTime" required>

            <label>Duration (Minutes)</label>
            <input type="number" id="duration" min="1" required>

            <label>Total Marks</label>
            <input type="number" id="totalMarks" min="1" required>

            <label>Number of Questions</label>
            <input type="number" id="totalQuestions" min="1" required>

            <button type="submit">Create Examination</button>

        </form>

    </div>

    <footer>
        Exam Guard © 2026
    </footer>

    <script>
    document.getElementById("examForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const exam = {
            examName: document.getElementById("examName").value,
            subject: document.getElementById("subject").value,
            examDate: document.getElementById("examDate").value,
            startTime: document.getElementById("startTime").value,
            duration: document.getElementById("duration").value,
            totalMarks: document.getElementById("totalMarks").value,
            totalQuestions: document.getElementById("totalQuestions").value
        };

        let examinations = JSON.parse(
            localStorage.getItem("examinations") || "[]"
        );

        examinations.push(exam);

        localStorage.setItem(
            "examinations",
            JSON.stringify(examinations)
        );

        alert("Examination created successfully!");

        window.location.href = "examiner.html";

    });
    </script>

</body>
</html>
