<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Examination</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
        }

        header {
            background: #1746a2;
            color: white;
            padding: 20px 40px;
        }

        .container {
            max-width: 700px;
            margin: 35px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h2 {
            color: #1746a2;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #1746a2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #10357d;
        }
    </style>
</head>

<body>

    <header>
        <h2 style="color:white; text-align:left; margin:0;">
            Smart Exam Monitoring System
        </h2>
    </header>

    <div class="container">

        <h2>Create New Examination</h2>

        <form id="examForm">

            <label>Examination Name</label>
            <input type="text" id="examName" required>

            <label>Subject</label>
            <input type="text" id="subject" required>

            <label>Examination Date</label>
            <input type="date" id="examDate" required>

            <label>Start Time</label>
            <input type="time" id="startTime" required>

            <label>Duration (Minutes)</label>
            <input type="number" id="duration" min="1" required>

            <label>Total Marks</label>
            <input type="number" id="totalMarks" min="1" required>

            <label>Number of Questions</label>
            <input type="number" id="totalQuestions" min="1" required>

            <button type="submit">Create Examination</button>

        </form>

    </div>
    <script>
    document.getElementById("examForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const exam = {
            examName: document.getElementById("examName").value,
            subject: document.getElementById("subject").value,
            examDate: document.getElementById("examDate").value,
            startTime: document.getElementById("startTime").value,
            duration: document.getElementById("duration").value,
            totalMarks: document.getElementById("totalMarks").value,
            totalQuestions: document.getElementById("totalQuestions").value
        };

        let examinations = JSON.parse(
            localStorage.getItem("examinations") || "[]"
        );

        examinations.push(exam);

        localStorage.setItem(
            "examinations",
            JSON.stringify(examinations)
        );

        alert("Examination created successfully!");

        window.location.href = "examiner.html";

    });
</script>

</body>
</html>
