<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Monitoring | Exam Guard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #FFF4C2;
            color: #222;
            text-align: center;
        }

        header {
            background: #F5C400;
            color: #000;
            padding: 22px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        header h2 {
            font-size: 23px;
        }

        .container {
            background: white;
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            border: 1px solid #f0e5b5;
        }

        .container h2 {
            color: #000;
            margin-bottom: 15px;
        }

        .container p {
            color: #555;
            line-height: 1.6;
        }

        video {
            width: 100%;
            max-width: 500px;
            border: 3px solid #F5C400;
            border-radius: 10px;
            background: black;
            margin-top: 15px;
        }

        #status,
        #faceStatus {
            margin: 15px;
            font-weight: bold;
        }

        #status {
            color: #333;
        }

        #faceStatus {
            color: #555;
        }

        button {
            padding: 12px 22px;
            margin: 12px;
            border: none;
            border-radius: 6px;
            background: #F5C400;
            color: #000;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background: #dfb200;
        }

        button:disabled {
            background: #d6d6d6;
            color: #777;
            cursor: not-allowed;
        }

        #continueBtn {
            margin-top: 20px;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #555;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px;
                padding: 20px;
            }

            header h2 {
                font-size: 20px;
            }

            button {
                margin: 8px 5px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>ONLINE EXAMINATION PORTAL</h2>
</header>

<div class="container">

    <h2>Webcam Monitoring</h2>

    <p>Please allow camera access before starting your examination.</p>

    <video id="camera" autoplay playsinline muted></video>

    <p id="status">Camera is not started.</p>
    <p id="faceStatus">Face detection is waiting...</p>

    <button onclick="startCamera()">
        Start Webcam
    </button>

    <button onclick="stopCamera()">
        Stop Webcam
    </button>

    <br>

    <button id="continueBtn" onclick="continueExam()" disabled>
        Continue to Examination
    </button>

</div>

<footer>
    Exam Guard © 2026
</footer>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>

let stream = null;

async function startCamera() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        document.getElementById("camera").srcObject = stream;

        await loadFaceModels();
        detectFace();

        document.getElementById("status").innerText =
            "Webcam is active.";

        document.getElementById("continueBtn").disabled = false;

    } catch (error) {

        document.getElementById("status").innerText =
            "Camera access denied or unavailable. Please check permissions.";

        console.error(error);
    }
}

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;

        document.getElementById("camera").srcObject = null;

        document.getElementById("status").innerText =
            "Camera stopped.";

        document.getElementById("faceStatus").innerText =
            "Face detection is waiting...";

        document.getElementById("continueBtn").disabled = true;
    }
}

function continueExam() {

    window.location.href = "exam.html";

}

</script>

<script>

async function loadFaceModels() {
    try {
        await faceapi.nets.tinyFaceDetector.loadFromUri('./models');
        await faceapi.nets.faceLandmark68Net.loadFromUri('./models');

        console.log("Face detection models loaded successfully!");

    } catch (error) {
        console.error("Error loading face detection models:", error);
    }
}

async function detectFace() {
    const video = document.getElementById("camera");
    const faceStatus = document.getElementById("faceStatus");

    if (!stream || !video.videoWidth) {
        return;
    }

    const faces = await faceapi.detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions()
    );

    if (faces.length === 0) {
        faceStatus.innerText = "No face detected!";
        faceStatus.style.color = "red";
    } else if (faces.length === 1) {
        faceStatus.innerText = "One face detected.";
        faceStatus.style.color = "green";
    } else {
        faceStatus.innerText = "Warning: Multiple faces detected!";
        faceStatus.style.color = "red";
    }

    if (stream) {
        requestAnimationFrame(detectFace);
    }
}

</script>

</body>
</html>
