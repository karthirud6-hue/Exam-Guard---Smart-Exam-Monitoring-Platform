<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Monitoring</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            text-align: center;
        }

        header {
            background: #172b8c;
            color: white;
            padding: 20px;
        }

        .container {
            background: white;
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ccc;
        }

        video {
            width: 100%;
            max-width: 500px;
            border: 3px solid #172b8c;
            border-radius: 10px;
            background: black;
        }

        button {
            padding: 12px 22px;
            margin: 12px;
            border: none;
            border-radius: 6px;
            background: #172b8c;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

        #status {
            margin: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h2>Smart Exam Monitoring System</h2>
</header>

<div class="container">

    <h2>Webcam Monitoring</h2>

    <p>Please allow camera access before starting your examination.</p>

    <video id="camera" autoplay playsinline muted></video>


    <p id="status">Camera is not started.</p>
    <p id="faceStatus">Face detection is waiting...</p>


    <button onclick="startCamera()">
        Start Webcam
    </button>

    <button onclick="stopCamera()">
        Stop Webcam
    </button>

    <br>

    <button id="continueBtn" onclick="continueExam()">
    Continue to Examination
</button>

</div>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>

let stream = null;

async function startCamera() {

    try {

        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        document.getElementById("camera").srcObject = stream;
        await loadFaceModels();
        detectFace();

        document.getElementById("status").innerText =
            "Webcam is active.";

        document.getElementById("continueBtn").disabled = false;

    } catch (error) {

        document.getElementById("status").innerText =
            "Camera access denied or unavailable. Please check permissions.";

        console.error(error);
    }
}

function stopCamera() {

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;

        document.getElementById("camera").srcObject = null;

        document.getElementById("status").innerText =
            "Camera stopped.";

        document.getElementById("continueBtn").disabled = true;
    }
}

function continueExam() {

    window.location.href = "exam.html";

}
</script>

<script>
async function loadFaceModels() {
    try {
        await faceapi.nets.tinyFaceDetector.loadFromUri('./models');
        await faceapi.nets.faceLandmark68Net.loadFromUri('./models');

        console.log("Face detection models loaded successfully!");

    } catch (error) {
        console.error("Error loading face detection models:", error);
    }
}
async function detectFace() {
    const video = document.getElementById("camera");
    const faceStatus = document.getElementById("faceStatus");

    if (!video.videoWidth) {
        requestAnimationFrame(detectFace);
        return;
    }

    const faces = await faceapi.detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions()
    );

    if (faces.length === 0) {
        faceStatus.innerText = "No face detected!";
        faceStatus.style.color = "red";
    } else if (faces.length === 1) {
        faceStatus.innerText = "One face detected.";
        faceStatus.style.color = "green";
    } else {
        faceStatus.innerText = "Warning: Multiple faces detected!";
        faceStatus.style.color = "red";
    }

    requestAnimationFrame(detectFace);
}

</script>

</body>
</html>
