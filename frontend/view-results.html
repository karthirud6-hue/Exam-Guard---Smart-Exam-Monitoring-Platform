<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Results</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #333;
        }

        header {
            background: #1746a2;
            color: white;
            padding: 20px 5%;
        }

        main {
            max-width: 1100px;
            margin: 35px auto;
            padding: 20px;
        }

        h2 {
            color: #1746a2;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 9px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #1746a2;
            color: white;
        }

        button {
            background: #1746a2;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

<header>
    <h2 style="color:white;">Smart Exam Monitoring System</h2>
</header>

<main>

    <h2>Student Examination Results</h2>
    <p>View examination scores and student performance.</p>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th>Student</th>
                    <th>Examination</th>
                    <th>Score</th>
                    <th>Percentage</th>
                    <th>Warnings</th>
                    <th>Status</th>
                </tr>
            </thead>

            <tbody id="resultsBody">
            </tbody>
        </table>

        <p id="emptyMessage" class="empty">
            No examination results available yet.
        </p>

    </div>

    <button onclick="window.location.href='examiner.html'">
        Back to Dashboard
    </button>

</main>

<script>
    const results = JSON.parse(
        localStorage.getItem("examResults") || "[]"
    );

    const resultsBody = document.getElementById("resultsBody");
    const emptyMessage = document.getElementById("emptyMessage");

    results.forEach(result => {
        const row = document.createElement("tr");

        [
            result.student || "Student",
            result.examName || "Examination",
            result.score || "0",
            result.percentage || "0%",
            result.warnings ?? 0,
            result.status || "Completed"
        ].forEach(value => {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
        });

        resultsBody.appendChild(row);
    });

    if (results.length > 0) {
        emptyMessage.style.display = "none";
    }
</script>

</body>
</html>
