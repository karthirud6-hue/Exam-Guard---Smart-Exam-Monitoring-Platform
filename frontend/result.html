<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results | Exam Guard</title>
    <script src="auth.js"></script>
    <script>requireRole("student");</script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js"></script>

    <style>
        .container {
            max-width: 560px;
            text-align: center;
            padding: 36px 28px;
            margin: 0 auto;
        }

        .result-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            border-radius: 50%;
        }

        .result-box {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            margin: 24px 0;
        }

        .result-box p {
            padding: 14px 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface-2);
            font-size: 12px;
            color: var(--muted);
        }

        .result-box p span {
            display: block;
            margin-top: 4px;
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .result-box h2,
        .result-box h3 { grid-column: 1 / -1; }

        .result-box h2 {
            margin-top: 8px;
            font-size: 22px;
        }

        .result-box h2 span { color: var(--primary); }

        .result-box h3 {
            font-weight: 500;
            color: var(--muted);
        }

        @media (max-width: 480px) {
            .result-box { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header class="appbar">
    <div class="appbar-inner">
        <div class="brand">
            <span class="brand-mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 5 3.5 8.5 8 9 4.5-.5 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/></svg></span>
            <span class="brand-name">Exam Guard</span>
        </div>
    </div>
</header>

<main class="page">

    <div class="card container">

        <div class="icon-chip green result-icon">
            <svg class="i i-lg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
        </div>

        <h1>Examination Results</h1>

        <h2 class="card-sub" style="font-size: 16px; font-weight: 600;">Congratulations!</h2>
        <p class="card-sub">Your examination has been submitted successfully.</p>

        <div class="result-box">
            <p>Total Questions <span id="totalQuestions">30</span></p>
            <p>Correct Answers <span id="correctAnswers">0</span></p>
            <p>Wrong Answers <span id="wrongAnswers">0</span></p>
            <h2>Your Score: <span id="score">0</span>/30</h2>
            <h3 id="resultMessage">Thank you for completing the examination!</h3>
        </div>

        <a class="btn" href="dashboard.html">Back to Dashboard</a>
    </div>

</main>

<footer class="site-footer">
    Exam Guard © 2026
</footer>

</body>
</html>
