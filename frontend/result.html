<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Examination Results</h1>

        <h2>Congratulations!</h2>
        <p>Your examination has been submitted successfully.</p>

        <div class="result-box">
            <p>Total Questions: <span id="totalQuestions">30</span></p>
            <p>Correct Answers: <span id="correctAnswers">0</span></p>
            <p>Wrong Answers: <span id="wrongAnswers">0</span></p>
            <h2>Your Score: <span id="score">0</span>/30</h2>
            <h3 id="resultMessage">Thank you for completing the examination!</h3>
        </div>

        <a href="dashboard.html">
            <button type="button">Back to Dashboard</button>
        </a>
    </div>

</body>
</html>
